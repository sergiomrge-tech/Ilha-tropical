name: Generate Full Island Terrain

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Scripts/terrain/generate_island_heightmap.py"
      - "Data/World/island_terrain_v1.json"
      - ".github/workflows/generate-terrain.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Generate 4033 terrain
        run: python Scripts/terrain/generate_island_heightmap.py

      - name: Verify output size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Generated/Terrain/island_v1.r16")
          expected = 4033 * 4033 * 2
          actual = p.stat().st_size
          print(f"R16 bytes: {actual:,}")
          if actual != expected:
              raise SystemExit(f"Unexpected size: {actual} != {expected}")
          PY

      - name: Upload terrain artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlhaTropical-Terrain-v1-4033
          path: |
            Generated/Terrain/island_v1.r16
            Generated/Terrain/island_v1.meta.json
            Generated/Terrain/island_v1_preview.pgm
          if-no-files-found: error
          retention-days: 30